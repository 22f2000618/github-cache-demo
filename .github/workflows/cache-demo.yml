name: Cache Demo
on: [push]
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: prime-cache-38f9a8a
      id: prime-cache-38f9a8a
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: cache-38f9a8a
    - run: echo "Cache hit: ${{ steps.prime-cache-38f9a8a.outputs.cache-hit }}"
    - run: npm ci
    - run: node index.js
